name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yaml

  deploy:
    environment: prod
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::677276075143:role/fem-ci-cd-service
      - run: aws s3 sync dist/ s3://fem-cicd-service-677276075143-eu-north-1-an/ --delete
